server {
    listen 80;
    server_name _;

    # The demo may rebuild this compatibility plugin at the same local URL.
    # Avoid pinning an earlier bundle between iterations.
    location = /lib/plugins/search/dist/docsie-search.js {
        proxy_pass http://docsie-airgap-workload:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://docsie-airgap-workload:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
